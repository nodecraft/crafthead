[package]
name = "hytale-skin-renderer"
version = "0.1.0"
edition = "2021"
authors = ["HytaleSkinRenderer Contributors"]

[lib]
name = "hytale_skin_renderer"
path = "src/lib.rs"

# Binaries require the "cli" feature (not available in WASM builds)
# These are disabled by default to support WASM compilation
# To run binaries: cargo run --features cli --bin <name>

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
# Same version `image` uses; needed directly for palette PNG output
png = "0.18"
glam = "0.28"

# CLI support (optional - not available for WASM)
clap = { version = "4.6", features = ["derive"], optional = true }

[features]
default = []
cli = ["clap", "gif"]
gif = ["image/gif"]

[dev-dependencies]
# Test utilities if needed

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
